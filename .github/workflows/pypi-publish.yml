name: Build and publish Python package to PyPI or TestPyPI

on: [push]

jobs:
  build-wheels-and-sdist:
    name: Build wheels and sdist
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build a binary wheel and a source tarball
        run: pipx run build --sdist --wheel --outdir dist/ .

      - uses: actions/upload-artifact@v7
        with:
          name: cibuilds
          path: |
            dist/*.tar.gz
            dist/*.whl

  publish-to-testpypi:
    needs: [build-wheels-and-sdist]
    name: Upload build to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jupyterhub-staticsystemdspawner
    permissions:
      id-token: write
    steps:
      - name: Downloads build wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: cibuilds
          path: dist
          merge-multiple: true

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  build-and-publish-to-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels-and-sdist]
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jupyterhub-staticsystemdspawner
    permissions:
      id-token: write
    steps:
      - name: Downloads build wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: cibuilds
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
