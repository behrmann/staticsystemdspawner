[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-staticsystemdspawner"
authors = [
    {name = "Jörg Behrmann", email = "behrmann@physik.fu-berlin.de"},
]
version = "0.1"
description = "JupyterHub Spawner using systemd unit files"
readme = "README.md"
license = {file = "LICENSE", content-type = "text/markdown"}
dependencies = [
    "jupyterhub>=0.9",
    "tornado>=5.0",
]

[project.entry-points."jupyterhub.spawners"]
staticsystemdspawner = "staticsystemdspawner:StaticSystemdSpawner"

[project.scripts]
jupyter-singleuser-wrapper = "staticsystemdspawner.wrapper:wrapped_main"
jupyter-staticsystemdspawner-unitgenerator = "staticsystemdspawner.unitgenerator:main"

[tool.ruff]
target-version = "py311"
line-length = 119
lint.select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = 3.11
# belonging to --strict
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
no_implicit_reexport = true
# extra options not in --strict
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
allow_redefinition = true
strict_equality = true
