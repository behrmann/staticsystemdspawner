[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-staticsystemdspawner"
authors = [
    {name = "Jörg Behrmann", email = "behrmann@physik.fu-berlin.de"},
]
version = "0.1"
description = "JupyterHub Spawner using systemd unit files"
readme = "README.md"
license = {file = "LICENSE", content-type = "text/markdown"}
dependencies = [
    "jupyterhub>=0.9",
    "tornado>=5.0",
]

[project.entry-points."jupyterhub.spawners"]
staticsystemdspawner = "staticsystemdspawner:StaticSystemdSpawner"
